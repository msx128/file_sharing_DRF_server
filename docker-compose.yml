services:
  web:
    # djnago need to somehow reach garage.localhost
    # right now this works on my pc, but I doubt it's consistency
    # the bad thing is I couldn't figure any solution to this
    # maybe this is my super specific problem or probaly django-storages issue
    build: .
    depends_on:
      - postgres
    volumes:
      - ./files:/app/files
      - ./file_sharing:/app/file_sharing
      - ./.env:/app/.env
    networks:
      - proxy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.web.rule=Host(`site.test`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web.loadbalancer.server.port=8000"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - GARAGE_BUCKET_NAME=${GARAGE_BUCKET_NAME}
      - GARAGE_KEY_ID=${GARAGE_KEY_ID}
      - GARAGE_KEY_SECRET=${GARAGE_KEY_SECRET}
    command: sh -c "/app/.venv/bin/python manage.py migrate && /app/.venv/bin/python manage.py runserver 0.0.0.0:8000"
  postgres:
    image: postgres:18.6
    container_name: py_postgres
    networks:
      - proxy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  garage:
    image: dxflrs/garage:99923a87182ae9252b421dda65c935b9c06b1444
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.garage.rule=Host(`garage.site.test`)"
      - "traefik.http.routers.garage.entrypoints=web"
      - "traefik.http.services.garage.loadbalancer.server.port=3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRIC_TOKEN: ${GARAGE_METRIC_TOKEN}
    volumes:
      - ./garage.toml:/etc/garage.toml
      - ./garage:/var/lib/garage
  traefik:
    image: traefik:3.7
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.site.test`)"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.entrypoints=web"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--api=true"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  postgres_data:
networks:
  proxy:
    name: proxy
